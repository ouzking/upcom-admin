# =============================================================================
# UPCOM ADMIN — déploiement Netlify (https://admin.upcomagency.com — alias https://upcom-admin.netlify.app)
# -----------------------------------------------------------------------------
# Les variables ci-dessous sont PUBLIQUES par nature (URL du projet + clé
# publishable) : Vite les intègre au bundle envoyé au navigateur. La sécurité
# repose sur la RLS du backend. Ne JAMAIS mettre ici une clé service_role /
# sb_secret_… ni un mot de passe.
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SUPABASE_URL = "https://gopjiglltfohtzeqijsq.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sz7_Mzej_DRrR1ru0_lIw_1NM69G3-"
  VITE_PUBLIC_SITE_URL = "https://www.upcomagency.com"

# Application monopage : toutes les routes servent index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Robots-Tag = "noindex, nofollow"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Seuls le back-office lui-même et le projet Supabase sont autorisés (scripts, appels, images).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gopjiglltfohtzeqijsq.supabase.co; font-src 'self' data:; connect-src 'self' https://gopjiglltfohtzeqijsq.supabase.co wss://gopjiglltfohtzeqijsq.supabase.co; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Fichiers versionnés par Vite (nom avec empreinte) : cache long.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
